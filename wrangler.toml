compatibility_date = "2025-09-23"
main = "src/index.ts"
name = "talus-watchdog"

# Keep *.workers.dev + version Preview URLs as backups alongside the custom domain.
preview_urls = true
workers_dev = true

# Workers Custom Domain - serves the status page at https://status.taluship.com.
# Must be top-level (not under [[d1_databases]]). Auto-creates the proxied DNS
# record in the taluship.com zone on deploy.
routes = [
  {pattern = "status.taluship.com", custom_domain = true},
]

# Stream Worker logs in `wrangler tail` / dashboard.
[observability]
enabled = true

# Min interval is 1 min; Free allows up to 3 cron triggers per Worker (Paid: 5).
[triggers]
crons = ["* * * * *"]

# D1 - source of truth: raw checks, incidents, components, daily rollups.
[[d1_databases]]
binding = "DB"
database_id = "e8f1b95c-9151-46eb-ba79-d6590183315b"
database_name = "watchdog-db"

# Optional KV cache (v1 uses the Cache API for page caching instead).
# Uncomment if read volume / D1 read cost becomes a concern and wire env.STATUS_CACHE in code.
# [[kv_namespaces]]
# binding = "STATUS_CACHE"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
